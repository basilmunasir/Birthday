<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday, Lulusee ❤️</title>
  
  <!-- Google Fonts: Elegant Serifs and Soft Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,600&family=Nunito:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-center">

  <!-- Romantic Ambient Background Floating Hearts -->
  <div class="hearts-background" aria-hidden="true">
    <span class="heart-particle">🌸</span>
    <span class="heart-particle">💖</span>
    <span class="heart-particle">✨</span>
    <span class="heart-particle">🤍</span>
    <span class="heart-particle">💕</span>
    <span class="heart-particle">🌷</span>
    <span class="heart-particle">✨</span>
    <span class="heart-particle">💖</span>
  </div>

  <main class="container">
    <!-- Main Birthday Card -->
    <article class="glass-card card-index animate-fade-in">
      
      <!-- Decorative Floating Top Heart Badge -->
      <div class="heart-badge pulse-glow" aria-hidden="true">
        <span>❤️</span>
      </div>

      <p class="greeting-subtitle">A Special Surprise For Someone Magical</p>
      
      <!-- Her Name & Birthday Title (Easy to Edit) -->
      <h1 class="hero-title">
        Happy Birthday,<br>
        <span class="highlight-name">Lulusee</span>
      </h1>

      <div class="ornament-divider" aria-hidden="true">
        <span></span><i>✦</i><span></span>
      </div>

      <!-- Personalized Sweet Note -->
      <p class="hero-message">
        Today is all about celebrating the beautiful person who makes my entire world a little brighter, warmer, and sweeter every single day.
      </p>

      <div class="tagline-pill">
        ✨ Made with all my love, just for you
      </div>

      <!-- Large Tablet-Friendly Action Button -->
      <nav class="action-nav">
        <a href="page2.html" class="btn btn-primary btn-tablet-large pulse-button">
          Open Your Surprise <span>→</span>
        </a>
      </nav>

    </article>
  </main>

</body>
</html>
